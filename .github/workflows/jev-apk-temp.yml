name: Temporary Jev Android APK build

on:
  push:
    branches:
      - chatgpt-jev-apk-build-20260921
    paths:
      - ".github/workflows/jev-apk-temp.yml"
      - "chatgpt-build/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build helper branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Clone upstream Jev project
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Finderchangchang/jev-chat-JARVIS.git jev-chat-JARVIS

      - name: Apply direct TypeSafe patch
        shell: bash
        run: |
          python3 chatgpt-build/patch_jev.py jev-chat-JARVIS

      - name: Build debug APK
        shell: bash
        working-directory: jev-chat-JARVIS
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK and signing tools
        shell: bash
        run: |
          mkdir -p artifact/build-tools/lib
          cp jev-chat-JARVIS/app/build/outputs/apk/debug/app-debug.apk artifact/jev-assistant-typesafe-template.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" artifact/build-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" artifact/build-tools/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifact/build-tools/lib/apksigner.jar
          cat > artifact/README.txt <<'EOF'
          Temporary private-build materials.
          APK contains a placeholder TypeSafe key asset.
          Signing keystore is generated locally after download.
          EOF

      - name: Upload build materials
        uses: actions/upload-artifact@v4
        with:
          name: jev-typesafe-build-materials
          path: artifact/
          retention-days: 1
